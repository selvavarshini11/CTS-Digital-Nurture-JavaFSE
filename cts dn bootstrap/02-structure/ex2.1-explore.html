<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 2.1 - Bootstrap Structure</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h1>Bootstrap Directory Structure</h1>
    <table class="table table-bordered table-striped mt-4">
      <thead class="table-dark"><tr><th>Folder</th><th>Purpose</th></tr></thead>
      <tbody>
        <tr><td>css/</td><td>Contains bootstrap.min.css and other CSS files</td></tr>
        <tr><td>js/</td><td>Contains bootstrap.bundle.min.js (includes Popper)</td></tr>
        <tr><td>icons/</td><td>Bootstrap Icons SVG and font files</td></tr>
      </tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
