<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 15.1 - Borders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Border Utilities</h2>
    <div class="d-flex flex-wrap gap-4 align-items-center">
      <img src="https://via.placeholder.com/100" class="border border-primary border-3" alt="border-primary"/>
      <img src="https://via.placeholder.com/100" class="rounded-circle border border-danger border-3" alt="rounded-circle"/>
      <img src="https://via.placeholder.com/100" class="rounded" alt="rounded"/>
      <img src="https://via.placeholder.com/100" class="rounded-pill border border-success border-2" alt="rounded-pill"/>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
