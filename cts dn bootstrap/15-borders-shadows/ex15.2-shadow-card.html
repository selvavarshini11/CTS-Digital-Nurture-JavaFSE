<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 15.2 - Shadow Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Shadows and Rounded</h2>
    <div class="row g-4">
      <div class="col-md-4"><div class="card shadow rounded p-3"><h5>shadow</h5><p>Normal shadow on card.</p></div></div>
      <div class="col-md-4"><div class="card shadow-lg rounded-pill p-3 text-center"><h5>shadow-lg</h5><p>Large shadow + rounded-pill.</p></div></div>
      <div class="col-md-4"><div class="card shadow-sm rounded-3 p-3"><h5>shadow-sm</h5><p>Small shadow + rounded-3.</p></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
