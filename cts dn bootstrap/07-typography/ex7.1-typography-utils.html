<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 7.1 - Typography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <p class="display-1">Display 1</p>
    <p class="display-4">Display 4</p>
    <p class="lead">Lead paragraph — slightly larger text.</p>
    <p class="text-muted">Muted text — lighter color.</p>
    <p class="fw-bold">Bold text using fw-bold</p>
    <p class="fw-light">Light text using fw-light</p>
    <p class="fst-italic">Italic text using fst-italic</p>
    <small class="text-secondary">Small secondary text</small>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
