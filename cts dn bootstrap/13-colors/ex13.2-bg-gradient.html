<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 13.2 - Background Gradient</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Background Gradients</h2>
    <div class="p-4 mb-3 bg-primary bg-gradient text-white rounded">bg-primary + bg-gradient</div>
    <div class="p-4 mb-3 bg-dark bg-gradient text-white rounded">bg-dark + bg-gradient</div>
    <div class="p-4 mb-3 bg-success bg-gradient text-white rounded">bg-success + bg-gradient</div>
    <div class="p-4 mb-3 bg-danger bg-gradient text-white rounded">bg-danger + bg-gradient</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
