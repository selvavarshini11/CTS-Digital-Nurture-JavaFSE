<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 18.2 - Accordion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5" style="max-width:600px">
    <h2 class="mb-4">Accordion</h2>
    <div class="accordion" id="acc">
      <div class="accordion-item">
        <h2 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#c1">Question 1</button></h2>
        <div id="c1" class="accordion-collapse collapse show" data-bs-parent="#acc"><div class="accordion-body">Answer to question 1.</div></div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#c2">Question 2</button></h2>
        <div id="c2" class="accordion-collapse collapse" data-bs-parent="#acc"><div class="accordion-body">Answer to question 2.</div></div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#c3">Question 3</button></h2>
        <div id="c3" class="accordion-collapse collapse" data-bs-parent="#acc"><div class="accordion-body">Answer to question 3.</div></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
