<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 17.2 - Icon Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Icon-Only Buttons</h2>
    <div class="d-flex gap-3">
      <button class="btn btn-primary"><i class="bi bi-house-fill"></i></button>
      <button class="btn btn-success"><i class="bi bi-check-circle-fill"></i></button>
      <button class="btn btn-danger"><i class="bi bi-trash-fill"></i></button>
      <button class="btn btn-warning"><i class="bi bi-pencil-fill"></i></button>
      <button class="btn btn-info"><i class="bi bi-search"></i></button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
