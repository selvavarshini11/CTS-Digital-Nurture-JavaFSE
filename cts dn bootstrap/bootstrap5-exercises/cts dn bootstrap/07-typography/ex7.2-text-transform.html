<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 7.2 - Text Transform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2>Text Transformation</h2>
    <p class="text-uppercase">this text is uppercase</p>
    <p class="text-lowercase">THIS TEXT IS LOWERCASE</p>
    <p class="text-capitalize">this text is capitalized</p>
    <p class="text-center fw-bold">Centered and Bold</p>
    <p class="text-end text-primary">Right aligned and primary</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
