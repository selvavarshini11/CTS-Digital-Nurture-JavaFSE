<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 2.2 - JS Plugins</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h1>Bootstrap JS Plugins</h1>
    <p>bootstrap.bundle.min.js includes Popper.js — needed for dropdowns, tooltips, modals.</p>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#demo">Open Modal</button>
    <div class="modal fade" id="demo" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">JS Plugin Works!</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">bootstrap.bundle.min.js is working correctly.</div>
      </div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
