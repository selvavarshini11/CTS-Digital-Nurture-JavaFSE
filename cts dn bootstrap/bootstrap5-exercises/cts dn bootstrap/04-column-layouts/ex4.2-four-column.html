<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 4.2 - Four Column Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Four Equal Columns</h2>
    <div class="row">
      <div class="col-sm-3"><div class="bg-primary text-white p-3 rounded text-center">Col 1</div></div>
      <div class="col-sm-3"><div class="bg-success text-white p-3 rounded text-center">Col 2</div></div>
      <div class="col-sm-3"><div class="bg-warning p-3 rounded text-center">Col 3</div></div>
      <div class="col-sm-3"><div class="bg-danger text-white p-3 rounded text-center">Col 4</div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
