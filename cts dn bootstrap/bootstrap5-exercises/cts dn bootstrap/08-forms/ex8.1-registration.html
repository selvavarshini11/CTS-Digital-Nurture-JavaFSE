<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 8.1 - Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5" style="max-width:500px">
    <h2 class="mb-4">Register</h2>
    <div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" placeholder="John Doe"/></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="you@example.com"/></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control"/></div>
    <div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="terms"/><label class="form-check-label" for="terms">I agree to terms</label></div>
    <div class="input-group mb-3"><span class="input-group-text">@</span><input type="text" class="form-control" placeholder="Username"/></div>
    <button class="btn btn-primary w-100">Register</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
