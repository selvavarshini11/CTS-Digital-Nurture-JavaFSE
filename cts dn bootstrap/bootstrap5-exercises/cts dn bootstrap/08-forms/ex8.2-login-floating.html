<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 8.2 - Login Floating</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5" style="max-width:400px">
    <h2 class="mb-4">Login</h2>
    <div class="form-floating mb-3"><input type="email" class="form-control" id="email" placeholder="name@example.com"/><label for="email">Email address</label></div>
    <div class="form-floating mb-3"><input type="password" class="form-control" id="password" placeholder="Password"/><label for="password">Password</label></div>
    <button class="btn btn-success w-100">Sign In</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
