<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 14.1 - Show Hide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2>Display Utilities</h2>
    <div class="d-none d-md-block bg-success text-white p-3 mt-3 rounded">Only visible on tablet and above (d-none d-md-block)</div>
    <div class="d-block d-md-none bg-danger text-white p-3 mt-3 rounded">Only visible on mobile (d-block d-md-none)</div>
    <div class="d-none d-lg-flex bg-primary text-white p-3 mt-3 rounded justify-content-center">Only flex on large screens (d-none d-lg-flex)</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
