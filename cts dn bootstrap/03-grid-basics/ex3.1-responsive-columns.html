<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 3.1 - Responsive Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Responsive Columns</h2>
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4 mb-3"><div class="bg-primary text-white p-3 rounded">Column 1</div></div>
      <div class="col-12 col-md-6 col-lg-4 mb-3"><div class="bg-success text-white p-3 rounded">Column 2</div></div>
      <div class="col-12 col-md-12 col-lg-4 mb-3"><div class="bg-danger text-white p-3 rounded">Column 3</div></div>
    </div>
    <p class="text-muted">↑ Stacks on mobile, 2-per-row on tablet, 3-per-row on desktop</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
