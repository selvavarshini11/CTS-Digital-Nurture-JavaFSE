<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 14.2 - Responsive Sidebar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container-fluid mt-4">
    <div class="row">
      <div class="col-md-3 d-none d-md-block bg-dark text-white p-4" style="min-height:300px">
        <h5>Sidebar</h5><p>Visible on tablet and above only.</p>
      </div>
      <div class="col-md-9 col-12 p-4 bg-light">
        <h5>Main Content</h5><p>This content always shows. The sidebar only appears on md+ screens.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
