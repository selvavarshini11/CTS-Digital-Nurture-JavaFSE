<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 5.2 - Reorder Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2>Column Reordering</h2>
    <div class="row mt-4">
      <div class="col-md-6 order-md-2"><div class="bg-danger text-white p-3">I appear SECOND on desktop (order-md-2)</div></div>
      <div class="col-md-6 order-md-1"><div class="bg-success text-white p-3">I appear FIRST on desktop (order-md-1)</div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
