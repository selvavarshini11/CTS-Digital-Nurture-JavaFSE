<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 11.1 - Profile Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5 d-flex justify-content-center">
    <div class="card" style="width:18rem">
      <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Profile"/>
      <div class="card-body">
        <h5 class="card-title">John Doe</h5>
        <p class="card-text text-muted">Frontend Developer</p>
        <a href="#" class="btn btn-primary w-100">View Profile</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
