<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 4.1 - Sidebar Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Sidebar Layout</h2>
    <div class="row">
      <div class="col-md-3"><div class="bg-dark text-white p-4 rounded"><h5>Sidebar</h5><ul class="list-unstyled mt-3"><li>Home</li><li>About</li><li>Contact</li></ul></div></div>
      <div class="col-md-9"><div class="bg-light p-4 rounded"><h5>Main Content Area</h5><p>This is the main content. It takes col-md-9 width.</p></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
