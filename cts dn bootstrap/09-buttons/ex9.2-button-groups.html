<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ex 9.2 - Button Groups</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Button Groups</h2>
    <div class="btn-group mb-4">
      <button class="btn btn-primary">Left</button>
      <button class="btn btn-primary">Middle</button>
      <button class="btn btn-primary">Right</button>
    </div>
    <h5>Toggle Buttons</h5>
    <div class="btn-group mt-2">
      <input type="checkbox" class="btn-check" id="b1"/><label class="btn btn-outline-success" for="b1">Bold</label>
      <input type="checkbox" class="btn-check" id="b2"/><label class="btn btn-outline-success" for="b2">Italic</label>
      <input type="checkbox" class="btn-check" id="b3"/><label class="btn btn-outline-success" for="b3">Underline</label>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
